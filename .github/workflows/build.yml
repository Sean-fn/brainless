name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: ./build.sh
      - name: Zip app
        run: ditto -c -k --keepParent build/*.app build/BrainlessCloud.zip
      - uses: actions/upload-artifact@v7
        with:
          name: BrainlessCloud
          path: build/BrainlessCloud.zip
